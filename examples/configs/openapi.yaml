openapi: 3.0.3
info:
  title: Sapling Quality Example API
  version: 0.1.0
servers:
  - url: http://127.0.0.1:3000
paths:
  /health:
    get:
      operationId: health
      responses:
        '200': { description: Healthy }
  /api/items:
    get:
      operationId: listItems
      responses:
        '200':
          description: Item list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object } }
  /api/orders:
    post:
      operationId: createOrder
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity: { type: integer, minimum: 1 }
      responses:
        '201': { description: Created }
