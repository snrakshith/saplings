services:
  api:
    build: {context: ../.., dockerfile: infra/docker/Dockerfile.api}
    environment: {PORT: "3000", CORS_ORIGIN: "http://localhost:8080"}
    ports: ["3000:3000"]
  web:
    build: {context: ../.., dockerfile: infra/docker/Dockerfile.web}
    ports: ["8080:8080"]
    depends_on: [api]
