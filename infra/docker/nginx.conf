map $request_method $sign_in_limit_key {
  default "";
  POST $binary_remote_addr;
}
limit_req_zone $sign_in_limit_key zone=starter_sign_in:10m rate=12r/m;

server {
  listen 8443 ssl;
  server_name _;
  ssl_certificate /run/starter/tls-cert.pem;
  ssl_certificate_key /run/starter/tls-key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;

  location = /api/starter/session {
    limit_req zone=starter_sign_in burst=12 nodelay;
    limit_req_status 429;
    proxy_pass http://api:3000;
  }
  location ~ ^/(api/|realms/|health$|ready$) { proxy_pass http://api:3000; }
  location ~ /\. { return 404; }
  location / { try_files $uri $uri/ /index.html; }
}
