# Stage the canonical Starter after running its migrations and account bootstrap. See starter/README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sapling-example-api
  namespace: sapling-quality
spec:
  replicas: 2
  selector: { matchLabels: { app: sapling-example-api } }
  template:
    metadata: { labels: { app: sapling-example-api } }
    spec:
      terminationGracePeriodSeconds: 25
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      volumes:
        - { name: signing, secret: { secretName: saplings-starter-signing } }
      containers:
        - name: api
          image: ghcr.io/YOUR_ORG/saplings-starter-api:CHANGE_ME
          ports: [{ containerPort: 3000 }]
          env:
            - { name: SAPLINGS_SIGNING_KEY_FILE, value: /run/starter/signing-key.pem }
          envFrom: [{ secretRef: { name: saplings-starter-env } }]
          volumeMounts: [{ name: signing, mountPath: /run/starter, readOnly: true }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: '1', memory: 512Mi }
          startupProbe:
            httpGet: { path: /health, port: 3000 }
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /ready, port: 3000 }
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 10
          securityContext:
            {
              allowPrivilegeEscalation: false,
              readOnlyRootFilesystem: true,
              capabilities: { drop: [ALL] },
            }
---
apiVersion: v1
kind: Service
metadata: { name: sapling-example-api, namespace: sapling-quality }
spec:
  selector: { app: sapling-example-api }
  ports: [{ name: http, port: 3000, targetPort: 3000 }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: sapling-example-api, namespace: sapling-quality }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: sapling-example-api } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: sapling-example-api, namespace: sapling-quality }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: sapling-example-api }
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }

---
# Internal alias for the web server's /api reverse proxy.
apiVersion: v1
kind: Service
metadata: { name: api, namespace: sapling-quality }
spec:
  selector: { app: sapling-example-api }
  ports: [{ name: http, port: 3000, targetPort: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: sapling-example-web, namespace: sapling-quality }
spec:
  replicas: 2
  selector: { matchLabels: { app: sapling-example-web } }
  template:
    metadata: { labels: { app: sapling-example-web } }
    spec:
      volumes:
        - name: tls
          secret:
            secretName: saplings-starter-tls
            items:
              - { key: tls.crt, path: tls-cert.pem }
              - { key: tls.key, path: tls-key.pem }
      containers:
        - name: web
          image: ghcr.io/YOUR_ORG/saplings-starter-web:CHANGE_ME
          ports: [{ containerPort: 8443 }]
          volumeMounts: [{ name: tls, mountPath: /run/starter, readOnly: true }]
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          startupProbe:
            httpGet: { path: /health, port: 8443, scheme: HTTPS }
            failureThreshold: 10
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /health, port: 8443, scheme: HTTPS }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8443, scheme: HTTPS }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata: { name: sapling-example-web, namespace: sapling-quality }
spec:
  selector: { app: sapling-example-web }
  ports: [{ name: http, port: 8443, targetPort: 8443 }]
