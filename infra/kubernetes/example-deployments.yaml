apiVersion: apps/v1
kind: Deployment
metadata:
  name: sapling-example-api
  namespace: sapling-quality
spec:
  replicas: 2
  selector: {matchLabels: {app: sapling-example-api}}
  template:
    metadata: {labels: {app: sapling-example-api}}
    spec:
      terminationGracePeriodSeconds: 25
      securityContext: {runAsNonRoot: true}
      containers:
        - name: api
          image: ghcr.io/YOUR_ORG/sapling-example-api:CHANGE_ME
          ports: [{containerPort: 3000}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          startupProbe:
            httpGet: {path: /health, port: 3000}
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /ready, port: 3000}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: 3000}
            periodSeconds: 10
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: sapling-example-api, namespace: sapling-quality}
spec:
  selector: {app: sapling-example-api}
  ports: [{name: http, port: 3000, targetPort: 3000}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: sapling-example-api, namespace: sapling-quality}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: sapling-example-api}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: sapling-example-api, namespace: sapling-quality}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: sapling-example-api}
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}

---
# Internal alias for the web server's /api reverse proxy.
apiVersion: v1
kind: Service
metadata: {name: api, namespace: sapling-quality}
spec:
  selector: {app: sapling-example-api}
  ports: [{name: http, port: 3000, targetPort: 3000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: sapling-example-web, namespace: sapling-quality}
spec:
  replicas: 2
  selector: {matchLabels: {app: sapling-example-web}}
  template:
    metadata: {labels: {app: sapling-example-web}}
    spec:
      containers:
        - name: web
          image: ghcr.io/YOUR_ORG/sapling-example-web:CHANGE_ME
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          startupProbe:
            httpGet: {path: /health, port: 8080}
            failureThreshold: 10
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata: {name: sapling-example-web, namespace: sapling-quality}
spec:
  selector: {app: sapling-example-web}
  ports: [{name: http, port: 8080, targetPort: 8080}]
