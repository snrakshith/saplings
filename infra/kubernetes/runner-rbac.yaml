apiVersion: v1
kind: ServiceAccount
metadata: { name: sapling-quality-runner, namespace: sapling-quality }
---
# This Role grants only read-only Kubernetes audit access. Destructive suite RBAC
# must be granted as a separate, time-scoped role through administrator approval.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: sapling-quality-readonly, namespace: sapling-quality }
rules:
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list]
  - apiGroups: ['']
    resources: [pods, services]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: sapling-quality-readonly, namespace: sapling-quality }
subjects:
  - { kind: ServiceAccount, name: sapling-quality-runner, namespace: sapling-quality }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: sapling-quality-readonly }
