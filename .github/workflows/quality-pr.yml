name: Sapling Quality PR
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    container:
      # Match the locked Playwright package so the browser and OS libraries are preinstalled.
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: pnpm install ${{ hashFiles('pnpm-lock.yaml') != '' && '--frozen-lockfile' || '--no-frozen-lockfile' }}
      - run: pnpm run build
      - run: pnpm run build:quality:demo
      - run: pnpm run build:console
      - name: Verify console onboarding in Chromium
        run: node console/test/browser.mjs
      - name: Start backend and frontend
        run: |
          pnpm run dev:api > /tmp/api.log 2>&1 &
          pnpm run dev:web > /tmp/web.log 2>&1 &
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:3000/health >/dev/null && curl -fsS http://127.0.0.1:5173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/api.log /tmp/web.log
          exit 1
      - run: pnpm run quality run --profile pr
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: sapling-quality-pr, path: quality-results/, if-no-files-found: warn }
