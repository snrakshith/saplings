name: Sapling Quality PR
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    container:
      # Match the locked Playwright package so the browser and OS libraries are preinstalled.
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: pnpm install ${{ hashFiles('pnpm-lock.yaml') != '' && '--frozen-lockfile' || '--no-frozen-lockfile' }}
      - run: pnpm run build
      - run: pnpm run build:starter
      - run: node apps/api/test/cashfree.mjs
      - run: pnpm run build:console
      - name: Verify console onboarding in Chromium
        run: node console/test/browser.mjs
      - name: Verify starter workflows in Chromium
        run: node apps/web/test/starter-browser.mjs
      - name: Start backend and frontend
        run: |
          pnpm run dev:api > /tmp/api.log 2>&1 &
          pnpm run dev:web > /tmp/web.log 2>&1 &
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:3000/health >/dev/null && curl -fsS http://127.0.0.1:5173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/api.log /tmp/web.log
          exit 1
      - run: pnpm run quality run --profile pr
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: sapling-quality-pr, path: quality-results/, if-no-files-found: warn }

  durable-starter:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run starter:prepare
      - name: Start the canonical Starter
        run: >-
          docker compose --env-file .starter/compose.env -f compose.yaml
          -f infra/docker/compose.providers.yaml -f infra/docker/compose.observability.yaml
          --profile starter up --build --wait --wait-timeout 180
      - name: Verify startup rejects incomplete secrets and privileged database roles
        run: |
          starter=(docker compose --env-file .starter/compose.env --profile starter)
          if "${starter[@]}" run --rm --no-deps -e SAPLINGS_VISITOR_SECRET= api; then
            exit 1
          fi
          owner_url=$(sed -n 's/^SAPLINGS_MIGRATION_DATABASE_URL=//p' .starter/compose.env)
          if "${starter[@]}" run --rm --no-deps -e "DATABASE_URL=$owner_url" api; then
            exit 1
          fi
      - name: Verify durable sign-in, config, events, jobs, and data after a restart
        run: |
          if command -v google-chrome >/dev/null; then
            PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)
            export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH
          else
            pnpm exec playwright install --with-deps chromium
          fi
          export NODE_EXTRA_CA_CERTS="$PWD/.starter/tls-cert.pem" SAPLINGS_TEST_COMPOSE=1
          SAPLINGS_TEST_RUNTIME_DATABASE_URL=$(sed -n 's|^DATABASE_URL=\(.*\)@postgres:|\1@127.0.0.1:|p' .starter/compose.env)
          test -n "$SAPLINGS_TEST_RUNTIME_DATABASE_URL"
          export SAPLINGS_TEST_RUNTIME_DATABASE_URL
          node apps/web/test/provider-stack.mjs
          node apps/web/test/durable-starter.mjs
      - name: Report stack state
        if: failure()
        run: |
          starter=(docker compose --env-file .starter/compose.env -f compose.yaml -f infra/docker/compose.providers.yaml -f infra/docker/compose.observability.yaml --profile starter)
          "${starter[@]}" ps --all
          "${starter[@]}" logs --no-color --tail 60 provider-init bootstrap api worker web observability
      - name: Shut down the disposable stack
        if: always()
        run: |
          if test -f .starter/compose.env; then
            docker compose --env-file .starter/compose.env -f compose.yaml -f infra/docker/compose.providers.yaml -f infra/docker/compose.observability.yaml --profile starter down --volumes
          fi
