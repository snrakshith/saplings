name: npm Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview:
        description: Validate packages and show the Changesets mode without releasing
        type: boolean
        default: true

permissions: {}

concurrency:
  group: npm-release-${{ github.ref }}

jobs:
  select-mode:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      live: ${{ steps.configuration.outputs.live }}
      mode: ${{ steps.changesets.outputs.mode }}
      publish-plan: ${{ steps.changesets.outputs.publish-plan-artifact-id }}
    steps:
      - name: Check release configuration
        id: configuration
        env:
          PREVIEW: ${{ inputs.preview }}
          RELEASE_ENABLED: ${{ vars.NPM_RELEASE_ENABLED }}
        run: |
          if [[ "$PREVIEW" == true ]]; then
            echo "Preview mode. This run will simulate versioning and check the package tarballs."
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Run a live release from main. Use preview to validate any branch."
            exit 1
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || "$RELEASE_ENABLED" == true ]]; then
            echo 'live=true' >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Automatic releases are disabled. Set NPM_RELEASE_ENABLED=true or manually start a live release on main."
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: changesets
      - name: Report Changesets mode
        env:
          MODE: ${{ steps.changesets.outputs.mode }}
        run: |
          printf 'Changesets mode: `%s`\n' "$MODE" >> "$GITHUB_STEP_SUMMARY"

  version:
    if: >-
      needs.select-mode.outputs.mode == 'version' &&
      needs.select-mode.outputs.live == 'true'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm run release:version

  pack:
    if: >-
      inputs.preview ||
      (needs.select-mode.outputs.mode == 'publish' &&
       needs.select-mode.outputs.live == 'true')
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package-artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Apply pending Changesets in preview
        if: inputs.preview && needs.select-mode.outputs.mode == 'version'
        run: |
          pnpm run release:version
          pnpm install --frozen-lockfile
      - run: pnpm run release:verify
      - name: Download release plan
        if: ${{ !inputs.preview }}
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.select-mode.outputs.publish-plan }}
          path: ${{ runner.temp }}/npm-release-plan
          merge-multiple: true
          digest-mismatch: error
      - name: Pack and verify release candidates
        env:
          PREVIEW: ${{ inputs.preview }}
        run: |
          if [[ "$PREVIEW" == true ]]; then
            mkdir -p "$RUNNER_TEMP/npm-release-plan"
            pnpm exec changeset publish-plan --output "$RUNNER_TEMP/npm-release-plan/publish-plan.json"
          fi
          pnpm exec changeset pack --from-publish-plan "$RUNNER_TEMP/npm-release-plan/publish-plan.json" --out-dir "$RUNNER_TEMP/npm-release-pack"
          node scripts/release/verify-npm-packages.mjs "$RUNNER_TEMP/npm-release-pack"
      - name: Upload verified release tarballs
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.preview && 'npm-release-preview' || 'npm-release-pack' }}
          path: ${{ runner.temp }}/npm-release-pack/
          if-no-files-found: error

  publish:
    if: >-
      needs.select-mode.outputs.live == 'true' &&
      needs.pack.outputs.package-artifact != ''
    needs: [select-mode, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.package-artifact }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
