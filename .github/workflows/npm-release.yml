name: npm Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview:
        description: Validate packages and show the Changesets mode without releasing
        type: boolean
        default: true

permissions: {}

concurrency:
  group: npm-release-${{ github.ref }}

jobs:
  select-mode:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.changesets.outputs.mode }}
      publish-plan: ${{ steps.changesets.outputs.publish-plan-artifact-id }}
    steps:
      - name: Check release configuration
        env:
          PREVIEW: ${{ inputs.preview }}
          RELEASE_ENABLED: ${{ vars.NPM_RELEASE_ENABLED }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$PREVIEW" != true ]]; then
            if [[ "$GITHUB_REF" != refs/heads/main || "$RELEASE_ENABLED" != true ]]; then
              echo "::error::A release requires the main branch and the repository Actions variable NPM_RELEASE_ENABLED=true. Use preview to validate any branch."
              exit 1
            fi
          elif [[ "$PREVIEW" == true ]]; then
            echo "Preview mode. This run will verify package tarballs."
          elif [[ "$RELEASE_ENABLED" != true ]]; then
            echo "::notice::Release automation is disabled. Set the repository Actions variable NPM_RELEASE_ENABLED=true to enable it."
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: changesets
      - name: Report Changesets mode
        env:
          MODE: ${{ steps.changesets.outputs.mode }}
        run: |
          printf 'Changesets mode: `%s`\n' "$MODE" >> "$GITHUB_STEP_SUMMARY"

  version:
    if: >-
      needs.select-mode.outputs.mode == 'version' &&
      github.ref == 'refs/heads/main' &&
      vars.NPM_RELEASE_ENABLED == 'true' &&
      !inputs.preview
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm run release:version

  pack:
    if: >-
      inputs.preview ||
      (needs.select-mode.outputs.mode == 'publish' &&
       github.ref == 'refs/heads/main' &&
       vars.NPM_RELEASE_ENABLED == 'true')
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package-artifact: ${{ steps.changesets.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run release:verify
      - if: ${{ !inputs.preview }}
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: changesets
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan }}

  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.NPM_RELEASE_ENABLED == 'true' &&
      !inputs.preview &&
      needs.pack.outputs.package-artifact != ''
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.package-artifact }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
