name: Sapling Scheduled Quality
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      profile:
        description: Quality execution profile
        default: nightly
        type: choice
        options: [nightly, main]
permissions:
  contents: read
jobs:
  quality:
    if: vars.SAPLING_ENABLE_SCHEDULED_QUALITY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: pnpm install ${{ hashFiles('pnpm-lock.yaml') != '' && '--frozen-lockfile' || '--no-frozen-lockfile' }}
      - run: pnpm run build
      - run: pnpm run build:quality
      - run: pnpm run build:web
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Tool prerequisites
        run: |
          # Install required engines here or use the dedicated runner image.
          # Nightly scenarios involving cluster faults require an isolated K8s cluster.
          pnpm run quality -- doctor
      - name: Execute configured nightly suites
        run: |
          pnpm run quality -- run --profile "${{ inputs.profile || 'nightly' }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: sapling-quality-nightly, path: quality-results/, if-no-files-found: ignore}
