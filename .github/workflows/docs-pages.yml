name: Documentation Pages

on:
  pull_request:
    branches: [main]
    paths:
      - 'sites/**'
      - 'packages/**'
      - 'docs/**'
      - 'examples/**'
      - 'README.md'
      - '.node-version'
      - 'scripts/build-docs-pages.sh'
      - 'scripts/sync-site-package-guides.mjs'
      - '.github/workflows/docs-pages.yml'
  push:
    branches: [main]
    paths:
      - 'sites/**'
      - 'packages/**'
      - 'docs/**'
      - 'examples/**'
      - 'README.md'
      - '.node-version'
      - 'scripts/build-docs-pages.sh'
      - 'scripts/sync-site-package-guides.mjs'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/configure-pages@v6
        id: pages
        if: github.ref == 'refs/heads/main'
      - name: Build and validate the documentation
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            PAGES_BASE_PATH="/${GITHUB_REPOSITORY#*/}"
          fi
          bash scripts/build-docs-pages.sh "$PAGES_BASE_PATH" "$RUNNER_TEMP/saplings-pages"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/saplings-pages

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
