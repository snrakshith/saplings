# Deploy the canonical Starter API image after running the migrations and account bootstrap.
# See apps/README.md for runtime settings. Supply a private network and HTTPS ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sapling-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: sapling-api }
  template:
    metadata:
      labels: { app: sapling-api }
    spec:
      securityContext:
        { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: example.invalid/saplings-starter-api:replace-me
          ports: [{ containerPort: 3000 }]
          env:
            - { name: SAPLINGS_SIGNING_KEY_FILE, value: /run/starter/signing-key.pem }
          envFrom: [{ secretRef: { name: saplings-starter-env } }]
          volumeMounts: [{ name: signing, mountPath: /run/starter, readOnly: true }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: '1', memory: 512Mi }
          readinessProbe: { httpGet: { path: /ready, port: 3000 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 3000 }, periodSeconds: 20 }
      volumes:
        - { name: signing, secret: { secretName: saplings-starter-signing } }
---
apiVersion: v1
kind: Service
metadata: { name: sapling-api }
spec:
  selector: { app: sapling-api }
  ports: [{ port: 80, targetPort: 3000 }]
