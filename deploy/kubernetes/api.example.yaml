# Deployment template: build/publish image, create sapling-config secret with config.ts,
# and sapling-env secret with runtime credentials first. Adapt NetworkPolicy and ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sapling-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: sapling-api }
  template:
    metadata:
      labels: { app: sapling-api }
    spec:
      securityContext:
        { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: example.invalid/sapling-api:0.10.0
          ports: [{ containerPort: 3000 }]
          env:
            - { name: SAPLING_CONFIG_PATH, value: /app/config-mounted/config.ts }
          envFrom: [{ secretRef: { name: sapling-env } }]
          volumeMounts: [{ name: config, mountPath: /app/config-mounted, readOnly: true }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: '1', memory: 512Mi }
          readinessProbe: { httpGet: { path: /ready, port: 3000 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 3000 }, periodSeconds: 20 }
      volumes:
        - { name: config, secret: { secretName: sapling-config } }
---
apiVersion: v1
kind: Service
metadata: { name: sapling-api }
spec:
  selector: { app: sapling-api }
  ports: [{ port: 80, targetPort: 3000 }]
