# Optional local PostgreSQL development environment. Use real secrets and a managed DB in production.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sapling_dev
      POSTGRES_USER: sapling_dev
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sapling_dev -d sapling_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
  valkey:
    image: valkey/valkey:8-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
